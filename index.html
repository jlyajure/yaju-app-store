<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaju App Store</title>
    <link rel="icon" type="image/png" href="yajuappstore.png">

    <style>
        body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        
        header { 
            background: linear-gradient(135deg, #1a1a1a, #000000); 
            padding: 60px 20px; 
            text-align: center; 
            border-bottom: 3px solid #d4af37; 
        }

        /* 👑 LOGO GRANDE Y REDONDO 👑 */
        .logo-principal {
            width: 250px; /* Lo subí de tamaño para que se vea imponente */
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.5)); /* Brillo dorado real */
        }

        header h1 { margin: 0; color: #d4af37; font-size: 3em; text-transform: uppercase; }
        header p { color: #aaaaaa; margin-top: 15px; font-style: italic; max-width: 600px; margin-left: auto; margin-right: auto; }

        .container { max-width: 1100px; margin: 50px auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; }

        .card { 
            background-color: #1e1e1e; border-radius: 20px; width: 300px; padding: 30px; 
            text-align: center; border: 1px solid #333; transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); border-color: #d4af37; }
        
        .btn { 
            display: inline-block; padding: 12px 25px; background-color: #d4af37; 
            color: #000; text-decoration: none; border-radius: 30px; font-weight: bold; 
        }
    </style>
</head>
<body>
    <header>
        <img src="yajuappstore.png" alt="Yaju App Store" class="logo-principal">
        <h1>Yaju App Store</h1>
        <p>"Diseño, utilidad y entretenimiento reunidos en un solo lugar. Bienvenido al siguiente nivel."</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>👑 Isla VIP</h2>
            <p>Notificaciones flotantes premium.</p>
            <a href="https://drive.google.com/drive/folders/1AeM97xgxHzhmKULLwXexRVPFtnuHqA5n?usp=drive_link" class="btn">Descargar</a>
        </div>
        <div class="card">
            <h2>📻 JTBP</h2>
            <p>Tu radio favorita en el bolsillo.</p>
            <a href="https://jazztabueno-productions.vercel.app/" class="btn">Visitar</a>
        </div>
        <div class="card">
            <h2>🎹 Music Land</h2>
            <p>Universo musical sin límites.</p>
            <a href="https://music-land-app-5kl2.vercel.app/" class="btn">Visitar</a>
        </div>
    </div>
</body>
</html>
