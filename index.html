<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaju App Store</title>

    <link rel="icon" type="image/png" href="logo-vip.png">

    <meta property="og:title" content="Yaju App Store">
    <meta property="og:description" content="Diseño, utilidad y entretenimiento reunidos en un solo lugar. Bienvenido al siguiente nivel.">
    <meta property="og:image" content="https://yaju-app-store.vercel.app/logo-vip.png">
    <meta property="og:url" content="https://yaju-app-store.vercel.app/">
    <meta property="og:type" content="website">

    <style>
        body { 
            background-color: #121212; 
            color: #ffffff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
        }
        
        header { 
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%); 
            padding: 60px 20px; 
            text-align: center; 
            border-bottom: 4px solid #d4af37; 
        }

        /* 👑 EL LOGO GRANDE Y REDONDO 👑 */
        .logo-principal {
            width: 250px; 
            height: 250px;
            object-fit: cover;
            border-radius: 50%; 
            margin-bottom: 20px;
            border: 3px solid #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            background-color: #000; /* Fondo negro por si la imagen tarda en cargar */
        }

        header h1 { 
            margin: 0; 
            color: #d4af37; 
            font-size: 3em; 
            text-transform: uppercase; 
        }
        header p { 
            color: #aaaaaa; 
            margin-top: 15px; 
            font-size: 1.2em; 
            font-style: italic;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .container { 
            max-width: 1100px; 
            margin: 50px auto; 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 40px; 
        }

        .card { 
            background-color: #1e1e1e; 
            border-radius: 20px; 
            width: 300px; 
            padding: 40px; 
            text-align: center; 
            border: 1px solid #333; 
            transition: 0.3s;
        }
        .card:hover { 
            transform: translateY(-10px); 
            border-color: #d4af37; 
        }
        
        .btn { 
            display: inline-block; 
            padding: 12px 30px; 
            background: #d4af37; 
            color: #000; 
            text-decoration: none; 
            border-radius: 30px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <header>
        <img src="logo-vip.png" alt="Logo Yaju App Store" class="logo-principal">
        <h1>Yaju App Store</h1>
        <p>"Diseño, utilidad y entretenimiento reunidos en un solo lugar. Bienvenido al siguiente nivel."</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>👑 Isla VIP</h2>
            <p>Notificaciones premium.</p>
            <a href="https://drive.google.com/drive/folders/1AeM97xgxHzhmKULLwXexRVPFtnuHqA5n?usp=drive_link" class="btn">Descargar</a>
        </div>
        <div class="card">
            <h2>📻 JTBP</h2>
            <p>Radio en tu bolsillo.</p>
            <a href="https://jazztabueno-productions.vercel.app/" class="btn">Visitar</a>
        </div>
        <div class="card">
            <h2>🎹 Music Land</h2>
            <p>Universo musical.</p>
            <a href="https://music-land-app-5kl2.vercel.app/" class="btn">Visitar</a>
        </div>
    </div>

</body>
</html>
